[package]
name = "libextos"
description = "Core library for ExtOS — shared types, config parsing, and CAS logic"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/extos-os"
authors = ["ExtOS Contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
libloading = "0.8"
bitflags = "2"
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
