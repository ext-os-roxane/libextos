[package]
name = "libextos"
description = "Core library for ExtOS — shared types, config parsing, and CAS logic"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/extos-os"
authors = ["ExtOS Contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
libloading = "0.8"
bitflags = "2"
tracing = "0.1"
anyhow = "1"
# Network fetcher for `ingest::download_from_mirror` (PLAN 2.1.2/2.1.3).
# Blocking client: pkt is a CLI, so no async runtime is required here.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
tonic = "0.14.6"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "fs"] }
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "noise", "yamux", "mdns", "kad", "identify", "request-response", "macros"] }
tonic-prost = "0.14.6"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"
