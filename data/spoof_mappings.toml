# ── Debian libc6 → RPM glibc ──
[[spoof]]
origin = "debian"
name = "libc6"
target = "rpm"
spoof_name = "glibc"
spoof_version = ""

# ── musl (Alpine) → glibc rows for glibc-origin roofs ──
[[spoof]]
origin = "alpine"
name = "musl"
target = "arch"
spoof_name = "glibc"
spoof_version = ""
extra_provides = ["libc.musl-x86_64.so.1"]

[[spoof]]
origin = "alpine"
name = "musl"
target = "debian"
spoof_name = "libc6"
spoof_version = ""
extra_provides = ["libc.musl-x86_64.so.1"]

